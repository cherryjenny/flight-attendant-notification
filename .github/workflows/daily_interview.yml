name: Daily Airline Interview Audio

on:
  schedule:
    # 매일 한국시간(KST) 오전 08:00 실행 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 깃허브 웹/앱에서 수동 즉시 실행 버튼 활성화

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BAND_ACCESS_TOKEN: ${{ secrets.BAND_ACCESS_TOKEN }}
      BAND_KEY: ${{ secrets.BAND_KEY }}
      GITHUB_PAGES_BASE_URL: ${{ secrets.GITHUB_PAGES_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 1 - Check schedule & Generate MP3
        run: python main.py --prepare

      - name: Step 2 - Commit & Push MP3 to GitHub Pages
        run: |
          if [ -f pending_task.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/audio/
            git commit -m "Add daily interview audio"
            git push
            sleep 15
          fi

      - name: Step 3 - Post to Naver Band & Update Sheet
        run: python main.py --publish
